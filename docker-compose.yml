name: cluster-scheduler

services:
  # Holds all cluster state: jobs, nodes, task assignments and the leader lease.
  postgres:
    image: postgres:18.6
    environment:
      # Local development credentials only.
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    ports:
      # Reachable from the host for tests and benchmarks, but not from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
