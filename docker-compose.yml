name: cluster-scheduler

# Settings shared by the three control plane replicas.
x-control-plane: &control-plane
  build:
    context: .
    target: control-plane
  image: cluster-scheduler/control-plane
  depends_on:
    postgres:
      condition: service_healthy

services:
  # Holds all cluster state: jobs, nodes, task assignments and the leader lease.
  postgres:
    image: postgres:18.6
    environment:
      # Local development credentials only.
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    ports:
      # Reachable from the host for tests and benchmarks, but not from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Three replicas: one leads, two stand by. Any of them serves the API.
  control-plane-1:
    <<: *control-plane
    environment:
      REPLICA_ID: control-plane-1
      DATABASE_URL: jdbc:postgresql://postgres:5432/scheduler
    ports:
      # Prometheus metrics at http://localhost:8081/metrics
      - "127.0.0.1:8081:8080"

  control-plane-2:
    <<: *control-plane
    environment:
      REPLICA_ID: control-plane-2
      DATABASE_URL: jdbc:postgresql://postgres:5432/scheduler
    ports:
      # Prometheus metrics at http://localhost:8082/metrics
      - "127.0.0.1:8082:8080"

  control-plane-3:
    <<: *control-plane
    environment:
      REPLICA_ID: control-plane-3
      DATABASE_URL: jdbc:postgresql://postgres:5432/scheduler
    ports:
      # Prometheus metrics at http://localhost:8083/metrics
      - "127.0.0.1:8083:8080"

  # Scale with: docker compose up --scale worker=N
  worker:
    build:
      context: .
      target: worker
    image: cluster-scheduler/worker
    environment:
      CONTROL_PLANE_ADDRESSES: control-plane-1:9090,control-plane-2:9090,control-plane-3:9090
      CPU_CAPACITY_MILLIS: 4000
      MEMORY_CAPACITY_MB: 8192
    depends_on:
      - control-plane-1
      - control-plane-2
      - control-plane-3
    deploy:
      replicas: 3

volumes:
  postgres-data:
