syntax = "proto3";

package clusterscheduler.v1;

option java_multiple_files = true;
option java_package = "clusterscheduler.proto";

// An amount of CPU and memory. Used for a node's total capacity, the space a
// node has free, and the amount a job asks for.
message Resources {
  // CPU in millicores: 1000 is one full core. Whole numbers keep the
  // scheduler's additions and subtractions exact.
  int64 cpu_millis = 1;
  // Memory in megabytes.
  int64 memory_mb = 2;
}
